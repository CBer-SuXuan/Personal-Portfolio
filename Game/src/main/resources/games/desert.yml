display-name: "<yellow>沙漠死斗"
template-name: "void_world"

min-players: 2
max-players: 16
countdown-seconds: 10

lobby-location: "0.5, 100, 0.5"

return-location: "world:-16.0, 66, -7.0"

generator:
  center: "0.5, 0, 0.5"

  pillar:
    material: "SANDSTONE"
    base-radius: 8.0
    radius-growth: 1
    height: 80

  floor:
    margin: 3.0
    thickness: 1
    style: "SQUARE"
    blocks:
      - SANDSTONE

item-give-interval: 5
random-item-pool:
  - "ALL"

event-interval: 20
events: [ ]

fixed-effect: "NONE"

border:
  min-radius: 3.0
  shrink-amount: 3.0
  safe-time: 60
  shrink-time: 10
  damage: 1.0
